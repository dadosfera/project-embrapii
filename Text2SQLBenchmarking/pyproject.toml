[project]
name = "prem-sql"
version = "0.1.0"
description = "Benchmark batch de Text-to-SQL em português com interface operacional"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.11.0",
    "bitsandbytes>=0.48.2",
    "chromadb>=0.5.0",
    "huggingface-hub>=0.24.7",
    "ipykernel>=7.1.0",
    "langchain-community>=0.3.21",
    "numpy>=1.26.4",
    "onnxruntime<1.24",
    "pandas>=2.3.3",
    "pm4py>=2.7.20.1",
    "premsql[evaluate,postgres,transformers]==0.2.10",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "python-levenshtein>=0.27.4",
    "sqlglot>=30.14.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.3",
    "vanna>=0.7.9",
]
[tool.uv]
override-dependencies = [
    "huggingface-hub==0.34.0",
    "transformers==4.56.2"
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]
interface = [
    "fastapi>=0.112.4",
    "httpx>=0.26.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "pytest>=9.0.2",
    "sqlglot>=30.14.0",
    "uvicorn>=0.32.1",
]

# catmat 15800: dipirona (associação) com estoque em instituicao_estoca_produto (5176 não tem estoque).
catmat: 15800
# catmat 85 (DIPIRONA SÓDICA 500 MG/ML, SOLUÇÃO INJETÁVEL): tem compras (686, 203 em 2021) e estoque.
catmat_compras: 85
# Compras só têm uma data por ano (1º de janeiro); 2021 é o ano com mais linhas e leitos tem as 12 competências.
periodo: {data_inicio: "2021-01-01", data_fim: "2021-12-31"}
cases:
  - /api/fornecedores/mapa-por-uf?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/fornecedores/ranking?data_inicio={data_inicio}&data_fim={data_fim}&limite=50
  - /api/fornecedores/ranking?data_inicio={data_inicio}&data_fim={data_fim}&uf=MG&limite=50
  - /api/fornecedores/ranking?data_inicio={data_inicio}&data_fim={data_fim}&uf=SP&limite=50
  - /api/fornecedores/top-por-uf?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/compras/kpis?data_inicio={data_inicio}&data_fim={data_fim}
  - {path: "/api/compras/kpis?data_inicio={data_inicio}&data_fim={data_fim}&catmat_id={catmat}", allow_empty: true}
  - /api/compras/kpis?data_inicio={data_inicio}&data_fim={data_fim}&catmat_id={catmat_compras}
  - /api/compras/kpis?data_inicio={data_inicio}&data_fim={data_fim}&tipo_compra=JUDICIAL
  - /api/compras/kpis?data_inicio={data_inicio}&data_fim={data_fim}&catmat_id={catmat_compras}&tipo_compra=ADMINISTRATIVA
  - /api/compras/por-mes?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/compras/fornecedores?data_inicio={data_inicio}&data_fim={data_fim}&limite=15
  - /api/compras/fabricantes?data_inicio={data_inicio}&data_fim={data_fim}&limite=15
  - /api/compras/modalidades?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/compras/tipos?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/compras/tipos?data_inicio={data_inicio}&data_fim={data_fim}&tipo_compra=ADMINISTRATIVA
  - /api/compras/recentes?data_inicio={data_inicio}&data_fim={data_fim}&limite=200
  - /api/medicamentos/busca?q=dipirona&limite=50
  - /api/medicamentos/busca?q=a&limite=200
  - /api/medicamentos/{catmat}/produtos
  - /api/medicamentos/{catmat}/resumo
  # lotes-vencendo depende de CURRENT_DATE: o resultado muda com o dia (os dois engines rodam no mesmo minuto).
  # 15800 não tem lote vencendo; para 85 usamos o máximo do endpoint (dias <= 365) para não esvaziar com o tempo.
  - {path: "/api/medicamentos/{catmat}/lotes-vencendo?dias=90", allow_empty: true}
  - /api/medicamentos/{catmat_compras}/lotes-vencendo?dias=365
  - /api/medicamentos/{catmat}/estoque-por-uf
  - {path: "/api/medicamentos/{catmat}/compras/evolucao-preco", allow_empty: true}
  - /api/medicamentos/{catmat_compras}/compras/evolucao-preco
  - {path: "/api/medicamentos/{catmat}/compras/fornecedores?limite=15", allow_empty: true}
  - /api/medicamentos/{catmat_compras}/compras/fornecedores?limite=15
  - {path: "/api/medicamentos/{catmat}/compras/fabricantes?limite=15", allow_empty: true}
  - /api/medicamentos/{catmat_compras}/compras/fabricantes?limite=15
  - {path: "/api/medicamentos/{catmat}/compras?limite=200&offset=0", allow_empty: true}
  - /api/medicamentos/{catmat_compras}/compras?limite=200&offset=0
  - /api/leitos/intervalo
  - /api/leitos/ufs
  - /api/leitos/kpis
  - /api/leitos/kpis?uf=MG
  - /api/leitos/por-uf
  - {path: /api/leitos/tipos-uti, unordered: true}  # VALUES sem ORDER BY
  - /api/leitos/evolucao?data_inicio={data_inicio}&data_fim={data_fim}
  - /api/leitos/instituicoes?limite=100
  - /api/leitos/opcoes
  - /api/leitos/painel?data_inicio={data_inicio}&data_fim={data_fim}
